<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        /* Reset default margins and padding for full coverage */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide scrollbars on the main page */
        }
        
        /* Style the iframe to cover the entire viewport, */
        iframe {
            display: block; /* Iframes are inline by default */
            height: 100vh; /* Set height to 100% of the viewport height */
            width: 100vw; /* Set width to 100% of the viewport width */
            border: none; /* Remove default border */
            position: absolute; /* Position the iframe relative to the viewport */
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- Replace 'https://example.com' with the desired URL or a relative path to another HTML file -->
    <iframe src="https://www.mathster.com/games/tetris/" title="Fullscreen Content"></iframe>
</body>
</html>
